name: build

# The Hebrew page is generated, and every generator in tools/ asserts its own
# anchors. That safety only helps if something runs it: before this workflow the
# build and the validator were run by hand, so a moved anchor or a figure that
# drifted from the record could sit in a commit unnoticed.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the Hebrew page from the English source
        # Fails loudly if any patch anchor moved. The brain repo is not checked
        # out here, so sync_figures falls back to the vendored record and says so.
        run: ./tools/build.sh

      - name: Every figure matches the figures of record
        run: python3 tools/verify_figures.py

      - name: The vendored record is a faithful copy
        run: python3 tools/sync_figures.py --check

      - name: The committed build is the build
        # src/index.html is generated but committed, so the two must agree. If
        # this fails someone edited the built page by hand instead of its source.
        run: |
          if ! git diff --quiet -- src/index.html; then
            echo "::error::src/index.html differs from a clean build."
            echo "Edit i18n/parts/ or tools/, then run ./tools/build.sh and commit the result."
            git diff --stat -- src/index.html
            exit 1
          fi

      - name: Regenerate the theme
        run: python3 tools/build_theme.py

      - name: The committed theme is the theme
        run: |
          if ! git diff --quiet -- theme/; then
            echo "::error::theme/ differs from a clean build — run python3 tools/build_theme.py and commit."
            git diff --stat -- theme/
            exit 1
          fi

      - name: No placeholder copy reaches the page
        # Field hints on the enquiry form are real content; unfinished copy is not.
        run: |
          if grep -n 'ממתין לחומרים\|TODO\|FIXME\|lorem ipsum' src/index.html; then
            echo "::error::placeholder copy found in the built page"
            exit 1
          fi

      - name: Liquid section stays under Shopify's limit
        run: |
          size=$(wc -c < theme/sections/gt-home.liquid)
          echo "gt-home.liquid: $size bytes (limit 262144)"
          [ "$size" -lt 262144 ] || { echo "::error::section exceeds Shopify's 256 KB limit"; exit 1; }

      - name: No remote image URL survives into the theme
        # src/index.html keeps its remote URLs on purpose — it is the browser
        # preview. build_theme.py rewrites them, and theme/ must carry none.
        run: |
          if grep -rn 'wsrv\.nl\|cloudfront\.net' theme/sections theme/assets; then
            echo "::error::theme still references a remote image host"
            exit 1
          fi

      - name: Nothing is hidden by pushing it off-screen
        # The page is RTL, so a large negative offset extends the scrollable
        # area instead of falling outside it. A honeypot at left:-9999px widened
        # the document to 11,310px and scrolled the whole page sideways into
        # empty paper — with a correct DOM, so only a render showed it. Hide
        # things by clipping.
        run: |
          if grep -nE '(left|right|top|margin-left|margin-right|text-indent): *-[0-9]{4,}' src/index.html; then
            echo "::error::off-screen offset found — hide with clip-path/clip instead"
            exit 1
          fi

      - name: The share card and structured data survive the build
        # og:image and the JSON-LD are easy to drop silently, and a blank
        # WhatsApp preview is invisible from the repo.
        #
        # They live in two places on purpose. Organization is site-wide, so it is
        # emitted once by the layout; the FAQ belongs to the home page, so
        # build_theme.py reads it out of that page's own <details> and emits it in
        # the section. Two Organization nodes on one page is the failure this
        # guards, alongside zero.
        run: |
          python3 - <<'EOF'
          import json, re, sys
          head = open('theme/layout/gt.liquid', encoding='utf-8').read()
          sec = open('theme/sections/gt-home.liquid', encoding='utf-8').read()
          fail = []
          for tag in ('og:image', 'og:image:width', 'twitter:image', 'rel="icon"'):
              if tag not in head:
                  fail.append(f'layout is missing {tag}')
          n_pre = head.count('rel="preconnect"')
          if n_pre != 2:
              fail.append(f'expected 2 preconnect hints, found {n_pre}')

          # The layout is hand-maintained (build_theme.py used to generate it and
          # silently reverted this). Per-page title and share card are the reason.
          for needed in ('template.suffix', 'page_description', '{{ og_img'):
              if needed not in head:
                  fail.append(f'layout lost its per-page SEO: no {needed}')

          def ld(html_, where):
              out = []
              for m in re.finditer(r'<script type="application/ld\+json">(.*?)</script>',
                                   html_, re.S):
                  try:
                      d = json.loads(m.group(1))
                  except json.JSONDecodeError as e:
                      fail.append(f'{where}: JSON-LD does not parse ({e})')
                      continue
                  out += d['@graph'] if '@graph' in d else [d]
              return out

          nodes = ld(head, 'layout') + ld(sec, 'section')
          types = [n.get('@type') for n in nodes]
          if types.count('Organization') != 1:
              fail.append(f'expected exactly 1 Organization on the home page, found '
                          f'{types.count("Organization")} — types: {types}')
          if 'FAQPage' not in types:
              fail.append(f'no FAQPage in the home page schema — types: {types}')
          for n in nodes:
              if n.get('@type') == 'FAQPage' and len(n.get('mainEntity', [])) < 3:
                  fail.append('FAQPage carries fewer than 3 questions — the <details>'
                              ' reader in build_theme.py probably stopped matching')

          n = len(re.findall(r'<img\b[^>]*width="\d+"[^>]*>', sec))
          if n < 60:
              fail.append(f'only {n} images carry width/height — expected 60+')
          for f in fail:
              print(f'::error::{f}')
          sys.exit(1 if fail else 0)
          EOF
